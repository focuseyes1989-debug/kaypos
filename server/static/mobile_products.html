<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/assets/kay/kay_128x128.png">
  <title>KAY POS Mobile Products</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --ink: #132238;
      --muted: #6b778c;
      --line: #e3e8f0;
      --brand: #3267e8;
      --brand-dark: #2758cf;
      --danger: #b42318;
      --success: #137a3a;
      --soft: #eaf0ff;
      --login-blue: #3267e8;
      --shadow: 0 12px 35px rgba(35, 52, 80, .08);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, "Myanmar Text", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
    }
    button, input, select { font: inherit; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      min-height: 42px;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      padding: 9px 14px;
      font-weight: 400;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button.secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    button.secondary:hover { border-color: #9bb4f4; background: #f6f8ff; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .55; }
    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }
    input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(50, 103, 232, .1);
    }
    label { display: grid; gap: 7px; font-weight: 650; color: var(--muted); }
    .shell { max-width: 920px; margin: 0 auto; padding: 12px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      margin: -12px -12px 12px;
      padding: 8px 12px;
      background: rgba(243, 246, 251, .94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .title { flex: 1; min-width: 0; }
    .title strong { display: block; font-size: 17px; }
    .title span { color: var(--muted); font-size: 12px; }
    .mobile-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; overflow:hidden; }.mobile-mark img{display:block;width:100%;height:100%;object-fit:contain}
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .82fr);
      gap: 12px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .span-2 { grid-column: 1 / -1; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      border: 1px dashed #aab7c7;
      background: #f8fafc;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--muted);
      text-align: center;
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    .status {
      min-height: 38px;
      border-radius: 10px;
      padding: 9px 11px;
      background: var(--soft);
      color: var(--brand-dark);
      border: 1px solid rgba(50, 103, 232, .22);
      word-break: break-word;
    }
    .status.error {
      background: #fff1f0;
      color: var(--danger);
      border-color: rgba(180, 35, 24, .25);
    }
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #101a2d, #173568);
    }
    .login-card {
      width: min(430px, 100%);
      background: var(--panel);
      border: 0;
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 28px 80px rgba(6, 17, 39, .4);
    }
    .login-logo { display: flex; align-items: center; gap: 13px; margin-bottom: 28px; }
    .login-mark { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; overflow:hidden; }.login-mark img{display:block;width:100%;height:100%;object-fit:contain}
    .login-logo h1 { margin: 0; color: #132238; font-size: 22px; line-height: 1.25; }
    .login-logo p { margin: 2px 0 0; color: #6b778c; font-size: 13px; line-height: 1.35; }
    .login-card label { display: block; margin: 15px 0 7px; color: #132238; font-size: 13px; font-weight: 650; }
    .login-card input { min-height: 0; padding: 12px 13px; border-color: #e3e8f0; border-radius: 10px; }
    .login-card input:focus { border-color: var(--login-blue); box-shadow: 0 0 0 3px rgba(50, 103, 232, .1); }
    .login-card button { width: 100%; min-height: 42px; margin-top: 20px; border-radius: 10px; background: var(--login-blue); padding: 12px 18px; font-weight: 400; }
    .login-card button:hover { background: #2758cf; }
    .login-card .status { min-height: 20px; margin-top: 12px; padding: 0; border: 0; background: transparent; color: #d13b4b; font-size: 13px; }
    .recent { display: grid; gap: 8px; }
    .recent-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px;
      background: #f7f9fc;
    }
    .recent-item strong { display: block; }
    .muted { color: var(--muted); font-size: 12px; }
    .success-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(22, 32, 51, .42);
    }
    .success-card {
      width: min(340px, 100%);
      display: grid;
      gap: 12px;
      justify-items: center;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 22px 18px 18px;
      text-align: center;
      box-shadow: 0 18px 48px rgba(22, 32, 51, .18);
    }
    .checkmark {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--success);
      position: relative;
    }
    .checkmark::after {
      content: "";
      position: absolute;
      left: 20px;
      top: 15px;
      width: 17px;
      height: 28px;
      border: solid #fff;
      border-width: 0 5px 5px 0;
      transform: rotate(45deg);
    }
    .success-card strong { font-size: 18px; }
    .success-card button { width: 100%; }
    #scannerVideo {
      width: 100%;
      border-radius: 12px;
      background: #111827;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .scanner-panel { order: -1; }
      .form-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .topbar { margin-bottom: 10px; }
    }
  </style>
  <style>
    /* Match the KAY Car mobile kiosk visual language. */
    :root {
      --bg: #0b1020;
      --panel: #151c2f;
      --ink: #f8fafc;
      --muted: #aab4ca;
      --line: #2b3652;
      --brand: #6d7cff;
      --brand-dark: #5969ee;
      --danger: #ff5368;
      --success: #39d98a;
      --soft: #0f1526;
      --login-blue: #6d7cff;
      --shadow: 0 24px 70px rgba(0, 0, 0, .46);
    }
    body {
      min-height: 100dvh;
      background: radial-gradient(circle at top, #202c50, #0b1020 58%);
      color: var(--ink);
      font-family: "Myanmar Text", "Segoe UI", sans-serif;
    }
    button {
      min-height: 52px;
      border-radius: 13px;
      background: var(--brand);
      padding: 10px 18px;
      font-weight: 700;
    }
    button:hover { background: var(--brand-dark); }
    button.secondary {
      border: 1px solid #465475;
      background: #0f1526;
      color: var(--ink);
    }
    button.secondary:hover { border-color: var(--brand); background: #18213a; }
    button.danger { background: var(--danger); }
    input, select {
      min-height: 54px;
      border-color: #465475;
      border-radius: 13px;
      padding: 10px 14px;
      background: #0f1526;
      color: #fff;
    }
    input::placeholder { color: #7f8ba6; }
    input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(109, 124, 255, .16);
    }
    label { color: var(--muted); }
    .shell { width: min(100%, 920px); padding: 18px; }
    .topbar {
      position: static;
      justify-content: center;
      min-height: 68px;
      margin: 0 0 18px;
      padding: 0;
      border: 0;
      background: transparent;
      backdrop-filter: none;
    }
    .mobile-mark {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: var(--brand);
    }
    .title { flex: 0 1 auto; }
    .title strong { font-size: 1.12rem; font-weight: 900; letter-spacing: .02em; }
    .title span { color: var(--muted); }
    #logoutBtn { margin-left: auto; min-height: 44px; }
    .grid { gap: 16px; }
    .panel {
      border-color: var(--line);
      border-radius: 24px;
      padding: 24px;
      background: rgba(21, 28, 47, .97);
      box-shadow: var(--shadow);
    }
    .preview {
      border: 3px dashed var(--brand);
      border-radius: 24px;
      background: #0f1526;
      color: var(--muted);
    }
    .preview img { border-radius: 20px; }
    .status {
      border-color: #465475;
      border-radius: 13px;
      background: #0f1526;
      color: var(--muted);
    }
    .status.error { border-color: rgba(255, 83, 104, .55); background: #321824; color: #ff9aaa; }
    .recent-item { border-color: #394664; border-radius: 13px; background: #10182b; padding: 13px; }
    .login {
      min-height: 100dvh;
      padding: 18px;
      background: radial-gradient(circle at top, #202c50, #0b1020 58%);
    }
    .login-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 30px 26px;
      background: rgba(21, 28, 47, .97);
      box-shadow: var(--shadow);
    }
    .login-logo { justify-content: center; margin-bottom: 26px; }
    .login-mark { width: 50px; height: 50px; border-radius: 16px; background: var(--brand); }
    .login-logo h1, .login-card label { color: var(--ink); }
    .login-logo p { color: var(--muted); }
    .login-card input { min-height: 54px; border-color: #465475; border-radius: 13px; background: #0f1526; }
    .login-card input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(109, 124, 255, .16); }
    .login-card button { min-height: 52px; border-radius: 13px; background: var(--brand); font-weight: 700; }
    .login-card button:hover { background: var(--brand-dark); }
    .login-card .status { color: #ff9aaa; }
    .success-modal { background: rgba(5, 9, 18, .76); }
    .success-card { border-color: var(--line); border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); }
    .checkmark { background: #173c32; }
    #scannerVideo { border: 3px solid var(--brand); border-radius: 24px; background: #080d19; }
    .scanner-title { display: block; margin-bottom: 10px; text-align: center; font-size: 1.05rem; }
    .scan-placeholder, .camera-box {
      width: min(72vw, 260px);
      aspect-ratio: 1;
      margin: 12px auto 18px;
      border-radius: 24px;
    }
    .scan-placeholder {
      display: grid;
      place-items: center;
      border: 3px dashed var(--brand);
      color: var(--ink);
      font-size: 3.2rem;
    }
    .camera-box { position: relative; overflow: hidden; border: 3px solid var(--brand); background: #080d19; }
    .camera-box[hidden], .scan-placeholder[hidden] { display: none !important; }
    .camera-box #scannerVideo { display: block; width: 100%; height: 100%; border: 0; border-radius: 0; object-fit: cover; }
    .camera-line { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: #ff5368; box-shadow: 0 0 12px #ff5368; }
    .scanner-note { margin: 10px 0 18px; color: var(--muted); text-align: center; line-height: 1.55; }
    #scanBtn { width: 100%; }
    @media (max-width: 760px) {
      .shell { padding: 12px; }
      .topbar { gap: 10px; margin: 6px 0 16px; }
      .mobile-mark { flex: 0 0 50px; }
      .title { flex: 1; }
      #logoutBtn { min-height: 42px; padding: 8px 12px; }
      .panel { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <form id="loginForm" class="login-card">
      <div class="login-logo"><div class="login-mark"><img src="/assets/kay/kay_128x128.png" alt="KAY POS"></div><div><h1>KAY POS Mobile</h1><p>Product entry for phones and tablets</p></div></div>
      <label for="loginUser">Username</label><input id="loginUser" autocomplete="username" required>
      <label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password" required>
      <button type="submit">Login to Mobile Products</button>
      <div id="loginStatus" class="status" hidden></div>
    </form>
  </section>

  <main id="appView" class="shell" hidden>
    <div class="topbar">
      <div class="mobile-mark"><img src="/assets/kay/kay_128x128.png" alt="KAY POS"></div>
      <div class="title">
        <strong>Mobile Product Entry</strong>
        <span id="userLabel">Ready</span>
      </div>
      <button id="logoutBtn" class="secondary" type="button">Logout</button>
    </div>

    <div class="grid">
      <section class="panel">
        <form id="productForm" class="form-grid">
          <label class="span-2">Product Name
            <input id="name" name="name" required placeholder="e.g. Nestle Extreme Pink 70g">
          </label>

          <label>SKU
            <input id="sku" name="sku" placeholder="Optional">
          </label>

          <label>Category
            <input id="category" name="category" list="categoryList" placeholder="Type or choose">
            <datalist id="categoryList"></datalist>
          </label>
          <label>Unit
            <input id="unit" name="unit" placeholder="pcs / box / pack">
          </label>

          <label>Price
            <input id="price" name="price" type="number" min="0" step="1" value="0">
          </label>
          <label>Low Stock
            <input id="lowStock" name="low_stock" type="number" min="0" step="1" value="0">
          </label>

          <label class="span-2">Product Photo
            <input id="image" name="image" type="file" accept="image/*" capture="environment">
          </label>

          <div id="preview" class="preview span-2">Take or choose a product photo</div>

          <div class="span-2">
            <strong>Recently Added</strong>
            <div id="recent" class="recent" style="margin-top: 8px;"></div>
          </div>

          <button id="saveBtn" class="span-2" type="submit">Save Product</button>
        </form>
      </section>

      <aside class="panel scanner-panel">
        <div id="status" class="status">Ready.</div>
        <div style="height: 12px;"></div>
        <strong class="scanner-title">Barcode Scanner</strong>
        <div id="scannerPlaceholder" class="scan-placeholder" aria-hidden="true">▥</div>
        <div id="scannerCamera" class="camera-box" hidden>
          <video id="scannerVideo" autoplay muted playsinline></video>
          <span class="camera-line"></span>
        </div>
        <button id="scanBtn" type="button">Camera ဖွင့်ပြီး Barcode Scan ဖတ်မည်</button>
        <p id="scannerNote" class="scanner-note">Camera permission တောင်းပါမည်။ HTTPS connection လိုအပ်ပါသည်။</p>
        <label for="barcode">Barcode Number
          <input id="barcode" name="barcode" inputmode="numeric" autocomplete="off" placeholder="Scan ဖတ်ပါ သို့မဟုတ် နံပါတ်ရိုက်ထည့်ပါ">
        </label>
      </aside>
    </div>
  </main>

  <div id="successModal" class="success-modal" hidden>
    <div class="success-card" role="alertdialog" aria-modal="true" aria-labelledby="successTitle">
      <div class="checkmark" aria-hidden="true"></div>
      <strong id="successTitle">Product Saved</strong>
      <div id="successMessage" class="muted">The product has been added.</div>
      <button id="successOkBtn" type="button">OK</button>
    </div>
  </div>

  <script src="/static/vendor/zxing-browser.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const state = {
      token: localStorage.getItem("kaypos_mobile_token") || "",
      user: JSON.parse(localStorage.getItem("kaypos_mobile_user") || "null"),
      stream: null,
      scanTimer: null,
      detector: null,
      zxingReader: null,
      zxingControls: null,
      scanCaptured: false,
      recent: JSON.parse(localStorage.getItem("kaypos_mobile_recent") || "[]"),
    };

    function setStatus(message, error = false) {
      const node = $("status");
      node.textContent = message;
      node.className = `status${error ? " error" : ""}`;
    }

    function setLoginStatus(message, error = false) {
      const node = $("loginStatus");
      node.hidden = false;
      node.textContent = message;
      node.className = `status${error ? " error" : ""}`;
    }

    async function api(path, options = {}) {
      const headers = options.headers || {};
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const response = await fetch(path, { ...options, headers });
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
      if (!response.ok) throw new Error(data.detail || `Request failed (${response.status})`);
      return data;
    }

    function showApp() {
      $("loginView").hidden = true;
      $("appView").hidden = false;
      $("userLabel").textContent = state.user ? `${state.user.username || "User"} connected` : "Connected";
      renderRecent();
      loadCategories();
    }

    function showLogin() {
      $("loginView").hidden = false;
      $("appView").hidden = true;
    }

    async function login(event) {
      event.preventDefault();
      setLoginStatus("Logging in...");
      try {
        const data = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("loginUser").value, password: $("loginPass").value }),
        }).then(async response => {
          const json = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(json.detail || "Login failed");
          return json;
        });
        state.token = data.token;
        state.user = data.user;
        localStorage.setItem("kaypos_mobile_token", state.token);
        localStorage.setItem("kaypos_mobile_user", JSON.stringify(state.user));
        showApp();
      } catch (err) {
        setLoginStatus(err.message, true);
      }
    }

    async function loadCategories() {
      try {
        const data = await api("/api/categories");
        $("categoryList").innerHTML = (data.categories || [])
          .map(category => `<option value="${escapeHtml(category)}"></option>`)
          .join("");
      } catch (err) {
        setStatus(`Could not load categories: ${err.message}`, true);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    $("image").addEventListener("change", () => {
      const file = $("image").files[0];
      if (!file) {
        $("preview").innerHTML = "Take or choose a product photo";
        return;
      }
      const url = URL.createObjectURL(file);
      $("preview").innerHTML = `<img src="${url}" alt="">`;
    });

    $("barcode").addEventListener("change", async () => {
      const barcode = $("barcode").value.trim();
      if (!barcode) return;
      try {
        const data = await api(`/api/products/barcode/${encodeURIComponent(barcode)}`);
        if (data.product) {
          setStatus(`Barcode already exists: ${data.product.name}`, true);
        }
      } catch (err) {
        setStatus(`Barcode check failed: ${err.message}`, true);
      }
    });

    async function saveProduct(event) {
      event.preventDefault();
      $("saveBtn").disabled = true;
      setStatus("Saving product...");
      try {
        const form = new FormData();
        for (const field of ["name", "barcode", "sku", "category", "price", "unit"]) {
          form.append(field, $(field).value);
        }
        form.append("cost", "0");
        form.append("stock", "0");
        form.append("location", "Mobile Entry");
        form.append("low_stock", $("lowStock").value);
        if ($("image").files[0]) form.append("image", $("image").files[0]);
        const data = await api("/api/mobile/products", { method: "POST", body: form });
        rememberProduct(data.product);
        $("productForm").reset();
        $("barcode").value = "";
        $("price").value = 0;
        $("lowStock").value = 0;
        $("preview").innerHTML = "Take or choose a product photo";
        setStatus(`Saved: ${data.product.name}`);
        showSuccessDialog(data.product.name);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        $("saveBtn").disabled = false;
      }
    }

    function showSuccessDialog(productName) {
      $("successMessage").textContent = `${productName} has been added.`;
      $("successModal").hidden = false;
      $("successOkBtn").focus();
    }

    function closeSuccessDialog() {
      $("successModal").hidden = true;
    }

    function rememberProduct(product) {
      state.recent.unshift(product);
      state.recent = state.recent.slice(0, 6);
      localStorage.setItem("kaypos_mobile_recent", JSON.stringify(state.recent));
      renderRecent();
    }

    function renderRecent() {
      $("recent").innerHTML = state.recent.length
        ? state.recent.map(product => `
            <div class="recent-item">
              <strong>${escapeHtml(product.name)}</strong>
              <div class="muted">Barcode: ${escapeHtml(product.barcode || "-")} | Stock: ${escapeHtml(product.stock ?? 0)}</div>
            </div>
          `).join("")
        : '<div class="muted">No mobile entries yet.</div>';
    }

    function handleBarcodeCaptured(value) {
      if (state.scanCaptured) return;
      const barcode = String(value || "").trim();
      if (!barcode) return;
      state.scanCaptured = true;
      $("barcode").value = barcode;
      stopScanner();
      setStatus(`Barcode captured: ${barcode}`);
      $("barcode").dispatchEvent(new Event("change"));
    }

    async function startScanner() {
      if (state.zxingControls || state.stream || state.scanTimer) {
        stopScanner();
        return;
      }
      state.scanCaptured = false;
      if (!window.isSecureContext) {
        setStatus("Live barcode scanning needs HTTPS on phones. Restart the server with --https, then open the https:// network address.", true);
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Camera access is not available in this browser. Try Chrome or Edge on the phone.", true);
        return;
      }
      const video = $("scannerVideo");
      $("scannerPlaceholder").hidden = true;
      $("scannerCamera").hidden = false;
      $("scanBtn").textContent = "Camera ပိတ်မည်";
      $("scannerNote").textContent = "Barcode ကို frame အလယ်တွင် တည့်တည့်ထားပါ။";
      if (window.ZXingBrowser?.BrowserMultiFormatReader) {
        try {
          state.zxingReader = state.zxingReader || new ZXingBrowser.BrowserMultiFormatReader();
          setStatus("Starting camera scanner...");
          state.zxingControls = await state.zxingReader.decodeFromVideoDevice(null, video, (result, error) => {
            if (result) handleBarcodeCaptured(result.getText());
          });
          setStatus("Point the camera at a barcode. Keep the barcode flat and fill the preview.");
          return;
        } catch (err) {
          stopScanner();
          setStatus(`Camera scanner unavailable: ${err.message}`, true);
          return;
        }
      }
      if (!("BarcodeDetector" in window)) {
        stopScanner();
        setStatus("Live barcode scanning is not supported in this browser. Try Chrome or Edge, or type the barcode manually.", true);
        return;
      }
      try {
        state.detector = state.detector || new BarcodeDetector({ formats: ["ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"] });
        state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = state.stream;
        await video.play();
        setStatus("Point the camera at a barcode. Keep the barcode flat and fill the preview.");
        state.scanTimer = setInterval(async () => {
          try {
            const codes = await state.detector.detect(video);
            if (codes.length) handleBarcodeCaptured(codes[0].rawValue);
          } catch {}
        }, 600);
      } catch (err) {
        stopScanner();
        setStatus(`Camera scanner unavailable: ${err.message}`, true);
      }
    }

    function stopScanner() {
      if (state.scanTimer) clearInterval(state.scanTimer);
      state.scanTimer = null;
      if (state.zxingControls) state.zxingControls.stop();
      state.zxingControls = null;
      if (state.stream) state.stream.getTracks().forEach(track => track.stop());
      state.stream = null;
      $("scannerVideo").srcObject = null;
      $("scannerCamera").hidden = true;
      $("scannerPlaceholder").hidden = false;
      $("scanBtn").textContent = "Camera ဖွင့်ပြီး Barcode Scan ဖတ်မည်";
      $("scannerNote").textContent = "Camera permission တောင်းပါမည်။ HTTPS connection လိုအပ်ပါသည်။";
    }

    $("loginForm").addEventListener("submit", login);
    $("productForm").addEventListener("submit", saveProduct);
    $("scanBtn").addEventListener("click", startScanner);
    $("successOkBtn").addEventListener("click", closeSuccessDialog);
    $("successModal").addEventListener("click", event => {
      if (event.target === $("successModal")) closeSuccessDialog();
    });
    $("logoutBtn").addEventListener("click", () => {
      stopScanner();
      localStorage.removeItem("kaypos_mobile_token");
      localStorage.removeItem("kaypos_mobile_user");
      state.token = "";
      state.user = null;
      showLogin();
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopScanner(); });
    window.addEventListener("pagehide", stopScanner);

    if (state.token) showApp();
    else showLogin();
  </script>
</body>
</html>
